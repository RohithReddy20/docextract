[project]
name = "docextract-kaggle-trials"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docextract",
  "torch==2.8.0",
  "transformers==5.3.0",
  "accelerate==1.12.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
docextract = { path = "../.." }
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
