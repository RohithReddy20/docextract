[project]
name = "docextract"
version = "0.1.0"
description = "Evidence-first, schema-guided document extraction"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "notices/*.txt"]
requires-python = ">=3.12,<3.13"
# Library ranges so docextract can share a remote engine environment; uv.lock pins exact versions.
dependencies = [
  "jsonschema>=4.23.0,<5",
  "pydantic>=2.11.9,<3",
  "pypdfium2==4.30.0",
]

[project.optional-dependencies]
benchmark = [
  "llama-extract-bench @ git+https://github.com/run-llama/ExtractBench.git@0e7647997211867060a645ac82deb9f7bc4a3b3f",
  "parse-bench==1.0.4",
]

[dependency-groups]
dev = ["pytest==8.4.2", "reportlab==4.4.4", "pypdf==6.1.1", "ruff==0.13.3"]

[project.scripts]
docextract = "docextract.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docextract"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["benchmark: optional official ExtractBench integration"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
